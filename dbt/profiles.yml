# Reads the lab's warehouse. Override with environment variables; nothing secret is written here.
fernhill:
  target: lab
  outputs:
    lab:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'warehouse') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('WAREHOUSE_USER', 'fernhill') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'fernhill') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'warehouse') }}"
      schema: analytics
      threads: 2
